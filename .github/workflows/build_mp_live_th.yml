name: Build MP Live TH APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MP_LIVE_TH_V1.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project ZIP
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q MP_LIVE_TH_V1.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/MP_LIVE_TH_V1
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP_LIVE_TH_V1-debug-apk
          path: build-src/MP_LIVE_TH_V1/app/build/outputs/apk/debug/app-debug.apk
