name: Build MP Live TH V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MP_LIVE_TH_V3.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q MP_LIVE_TH_V3.zip -d build-src

      - name: Verify AGP 9 built-in Kotlin migration
        shell: bash
        working-directory: build-src/MP_LIVE_TH_V3
        run: |
          if grep -R --line-number --include='*.gradle.kts' --include='*.gradle' 'org.jetbrains.kotlin.android\|kotlin-android' .; then
            echo "ERROR: Legacy Kotlin Android plugin found. AGP 9.x uses built-in Kotlin."
            exit 1
          fi
          echo "OK: no legacy Kotlin Android plugin"

      - name: Build debug APK
        working-directory: build-src/MP_LIVE_TH_V3
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP_LIVE_TH_V3-debug-apk
          path: build-src/MP_LIVE_TH_V3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
